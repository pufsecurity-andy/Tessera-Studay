<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera Study</title>
<meta name="description" content="研究 TesseraHSM 開源整合式 HSM 的頁面集合。">
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel2:#f0efeb; --ink:#1d1d1b; --muted:#5f5e5a; --line:#dcdad3; --accent:#2f5bd3;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141413; --panel:#1c1c1a; --panel2:#24241f; --ink:#ecebe6; --muted:#a3a29b; --line:#34332e; --accent:#7aa2ff;}
}
:root[data-theme="dark"]{--bg:#141413; --panel:#1c1c1a; --panel2:#24241f; --ink:#ecebe6; --muted:#a3a29b; --line:#34332e; --accent:#7aa2ff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans)}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
h1{font-size:32px;margin:34px 0 8px;line-height:1.25}
.lede{color:var(--muted);margin:0 0 28px;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;color:var(--ink);transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card h2{font-size:18px;margin:0 0 4px}
.card .d{color:var(--muted);font-size:14px;margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.date{font-size:12px;color:var(--muted);margin-top:10px}
footer{color:var(--muted);font-size:12.5px;padding:36px 0 50px}
</style>
</head>
<body>
<div class="wrap">
  <header><b>Tessera Study</b><button class="btn" id="themeBtn" type="button">主題</button></header>
  <h1>Tessera 研究頁面</h1>
  <p class="lede">分析 <a href="https://github.com/TesseraHSM">TesseraHSM</a> 開源整合式 HSM 專案的規格、晶片 RTL、韌體與主機軟體。</p>
  <div class="grid" id="pages"></div>
  <footer>原始碼與分析對象的 submodule：<a href="https://github.com/pufsecurity-andy/Tessera-Studay">pufsecurity-andy/Tessera-Studay</a></footer>
</div>
<script>
(function(){
  var r=document.documentElement,b=document.getElementById('themeBtn');
  try{var t=localStorage.getItem('tsr-theme');if(t)r.setAttribute('data-theme',t);}catch(e){}
  b.onclick=function(){var c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var n=c==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('tsr-theme',n);}catch(e){}};
})();

// 新增頁面：把 HTML 放進 pages/，再在這裡加一筆。
var PAGES=[
  {href:'pages/code-map.html',title:'Code Map',date:'2026-10-28',
   desc:'六個 repo 的七層架構展開圖、請求路徑、模組樹、TBOR 指令集、信任鏈與安全設計原文。',
   tags:['架構','安全設計']},
  {href:'pages/asic.html',title:'Tessera ASIC 架構與需求',date:'2026-10-28',
   desc:'CRD v0.5.0 的 375 項需求：晶片方塊圖、效能目標、實作現況，以及可搜尋的完整需求原文。',
   tags:['晶片架構','需求原文']},
  {href:'pages/system-map.html',title:'System Map',date:'2026-10-28',
   desc:'雲端、伺服器、PCIe 卡、晶片四層的關係圖，可切換 7 條資料流，並標示每個元件的開源狀態。',
   tags:['系統架構','資料流','互動圖']}
];

var el=document.getElementById('pages');
PAGES.forEach(function(p){
  var a=document.createElement('a');a.className='card';a.href=p.href;
  a.innerHTML='<h2>'+p.title+'</h2><p class="d">'+p.desc+'</p><div class="tags">'+
    p.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div><div class="date">'+p.date+'</div>';
  el.appendChild(a);
});
</script>
</body>
</html>
